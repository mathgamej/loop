<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body { font-size: 20px; padding: 20px; max-width: 600px; margin: auto; }
            textarea {font-size: 20px; width: 100%; height: 80px; margin-bottom: 10px; box-sizing: border-box; }
            button {font-size: 18px; padding: 8px 16px; margin-right: 5px; }
        </style>
    </head>
    <body>

    </body>

            const utterance = new SpeechSynthesisUtterance(text);

            utterance.lang = 'en-US';
            utterance.rate = 1;

            utterance.onend = function() {
                if (isPlaying) {

            };

            window.speechSynthesis.speak(utterance);
        }
            startBtn.addEventListener('click', () => {
                if (textInput.value.trim() === '') return;
                
                window.speechSynthesis.cancel();

                isPlaying = true;
                startBtn.disabled = true;

                speakText();
            });

            stopBtn.addEventListener('click', () => {
                isPlaying = false;
                window.speechSynthesis.cancel();
                startBtn.disabled = false;
